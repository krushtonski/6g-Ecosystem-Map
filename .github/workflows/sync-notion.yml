name: Sync map from Notion

on:
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch: {}     # "Run workflow" button for an instant update

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export public fields from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs
      - name: Commit if the public data changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "map-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/ecosystem.json
            git commit -m "Update map data from Notion"
            git push
          else
            echo "Nothing to commit"
          fi
